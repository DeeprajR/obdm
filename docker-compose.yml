# Local stand-ins for every production dependency (build plan, "Prerequisites").
# A demo needs none of the real services, provided each stays behind its port
# (§10) so it can be swapped later without touching a use case.
name: obdm

services:
  postgres:
    # 16+ is load-bearing: FOR UPDATE SKIP LOCKED, partial unique indexes and
    # the transactional counter of §7.1 all depend on it (§11.3).
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: obdm
    ports:
      # 5433, not 5432: a natively installed PostgreSQL commonly holds 5432, and
      # a connection that silently reaches the wrong server is a bad hour.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Roles and the test database are provisioned here rather than in a
      # migration: roles are cluster-wide, and production provisions them
      # outside the release. Migrations own schemas, tables and grants.
      - ./db/docker/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d obdm']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # The local mail catcher. Invites, OTPs and update-request outcomes all
    # land in its inbox, so no sending domain or provider account is needed.
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # web inbox
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  storage:
    # S3-compatible object storage for seals (§3) and, later, camera frames (§4).
    # Private bucket; objects are only ever served through an authenticated route.
    #
    # S3Mock, not MinIO. In October 2026 MinIO's images stopped being pullable
    # without an account from both Docker Hub ("pull access denied") and
    # quay.io (401), which broke every fresh checkout at `pnpm up`. S3Mock is
    # Apache-2.0, maintained by Adobe, speaks the S3 API the adapter uses
    # (HeadBucket, PutObject, GetObject, DeleteObject, path-style) and creates
    # the bucket itself at start. No console: list what is in the bucket with
    # `curl http://localhost:9090/obdm`.
    image: adobe/s3mock:latest
    restart: unless-stopped
    ports:
      - '9090:9090'
    environment:
      # Spring property names; the short `initialBuckets` form of older
      # releases is ignored by this one. Files live inside the container and
      # survive a stop and start, which is what the health test does to it; a
      # `down` loses development seals, which is fine.
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: obdm
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    healthcheck:
      # The root answers ListBuckets once the server is up.
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9090/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
