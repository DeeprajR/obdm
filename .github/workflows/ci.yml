name: CI

# The CI gates are the reviewer (build plan, "Standing rules for a solo build"):
# no second reader looks at a commit here, so the boundary check, the contract
# tests, the wording regression and the role matrix are what catch what a
# reviewer would.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Reads the repository and nothing else. Without this the token gets the
# repository's default, which on older repositories is write to everything.
permissions:
  contents: read
  # The secret scan lists a pull request's commits through the API.
  pull-requests: read

env:
  MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/obdm
  DATABASE_URL: postgres://app_web:app_web@localhost:5432/obdm
  BOT_DATABASE_URL: postgres://app_bot:app_bot@localhost:5432/obdm
  # The suite's own globalSetup connects with this URL's literal role (unlike
  # db:migrate, which always substitutes `migrator` regardless of what's in
  # MIGRATION_DATABASE_URL). Postgres's `ALTER DEFAULT PRIVILEGES FOR ROLE
  # migrator` only fires for objects `migrator` itself creates, so migrating
  # here as the postgres superuser silently drops the base grants app_web and
  # app_bot depend on — this must match .env.example's convention.
  TEST_DATABASE_URL: postgres://migrator:migrator@localhost:5432/obdm_test

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 16+ is load-bearing (§11.3), so CI must not drift to whatever is
        # newest and quietly stop testing what production runs.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: obdm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads history, not only the checkout.
          fetch-depth: 0

      # §11.7: every push is scanned for a committed secret. The development
      # passwords in db/docker/init.sql and .env.example are known and listed
      # in .gitleaks.toml; anything else that looks like a credential fails
      # the build before it is reviewed, because on a solo build it would not
      # be.
      - name: Secret scan (§11.7)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------- static
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Import boundaries (§11.2)
        run: pnpm boundaries

      - name: Prove the boundary check rejects a deep import
        run: pnpm boundaries:prove

      # -------------------------------------------------------------- database
      - name: Provision roles
        run: psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/docker/init.sql

      # packages/ops/src/health.test.ts proves a health tile goes red by
      # stopping the real container (P10), not a mock, so the suite needs
      # Mailpit and S3Mock actually running under the exact container names
      # docker-compose.yml's `name: obdm` produces. Postgres is
      # already covered by the `services:` block above.
      - name: Start mail and storage stand-ins
        run: |
          docker compose up --detach --wait mailpit storage

      - name: Migrations apply cleanly to an empty database (§5.9)
        run: |
          pnpm db:migrate
          pnpm db:migrate:bot

      - name: Migrations are idempotent against an already-migrated database
        # The second half of §5.9's requirement: clean against empty, and clean
        # against a database seeded from the previous release.
        run: |
          pnpm db:migrate
          pnpm db:migrate:bot

      - name: The bot's migrations never mention the shared tables (§2.1)
        run: pnpm check:bot-migrations

      # ------------------------------------------------------------------ test
      - name: Seed
        run: pnpm db:seed
        env:
          NODE_ENV: test

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # `db:push` must be impossible here. It is guarded by NODE_ENV and CI, and
      # this asserts the guard rather than trusting it (§5.9).
      - name: db:push is refused in CI
        run: |
          if pnpm db:push; then
            echo "::error::db:push succeeded in CI. The guard in db/src/push-guard.ts is not working."
            exit 1
          fi
          echo "db:push correctly refused"
