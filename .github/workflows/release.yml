name: Release

# Builds the six images and pushes them to GitHub's registry (docs/deployment.md).
#
# Deliberately stops there. What happens next is a release on the target,
# which pulls these images, runs the migrations, and rolls the applications,
# and that step belongs to whoever holds the production credentials, not to a
# workflow that would need them. A tag `v*` is a release; a push to main is a
# candidate tagged with its commit.
#
# Every image is built for linux/amd64 and linux/arm64, each on a runner of its
# own architecture rather than under emulation, then joined into one tag. The
# same tag runs on an x86 VPS and on an ARM one (Oracle's Ampere, AWS
# Graviton), and the server pulls whichever matches it.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        app: [doctor, admin, centre, volunteer, donor, worker]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      # A registry name must be lowercase, and the owner in github.repository
      # is not.
      - name: Image name
        run: echo "IMAGE=${IMAGE_PREFIX,,}/${{ matrix.app }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      # Pushed by digest only. The tags are put on in `merge`, once both
      # architectures exist, so a tag never points at half an image.
      - id: build
        name: Build and push by digest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app == 'worker' && 'deploy/Dockerfile.worker' || 'deploy/Dockerfile.web' }}
          build-args: |
            APP=${{ matrix.app }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [doctor, admin, centre, volunteer, donor, worker]

    steps:
      - name: Image name
        run: echo "IMAGE=${IMAGE_PREFIX,,}/${{ matrix.app }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Tag both architectures as one image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
